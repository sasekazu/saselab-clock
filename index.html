<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Saselab Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Murecho:wght@300;400;500;600&display=swap">
<style>
  :root {
    --bg: #000;
    --fg: #f5f5f5;
    --dim: #b5b5b5;
    --faint: #4a4a4a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: "Murecho", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    overflow: hidden;
  }
  .stage {
    height: 100%;
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 4vw;
    padding: 4vh 4vw;
  }
  :root { --clock: min(88vh, 46vw); }
  #main-clock { height: var(--clock); width: auto; aspect-ratio: 1; }
  .info {
    display: flex; flex-direction: column; justify-content: space-between;
    height: var(--clock); padding: calc(var(--clock) * 0.02) 0; gap: 3vh; min-width: 0;
  }
  .label { font-size: min(2.4vh, 1.4vw); letter-spacing: .22em; color: var(--dim); text-transform: uppercase; }
  .date { font-size: min(6.2vh, 3.4vw); font-weight: 500; letter-spacing: .04em; white-space: nowrap; }
  .time {
    font-size: min(15.5vh, 8.8vw); font-weight: 300; letter-spacing: .02em;
    font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap;
  }
  .tod { display: inline-flex; align-items: center; gap: .3em; font-weight: 500; color: var(--tod, var(--dim)); }
  .tod svg { height: 1.45em; width: 1.45em; flex: none; }
  .main-info .tod { font-size: min(3.6vh, 2vw); }
  .sub-head { display: flex; align-items: center; gap: 1.4vw; }
  .sub .tod { font-size: min(2.8vh, 1.6vw); }
  /* --- class schedule --- */
  .school { display: flex; flex-direction: column; gap: .9vh; width: min(100%, 46vw); }
  .sch-row { display: flex; align-items: baseline; justify-content: space-between; gap: 2vw; white-space: nowrap; }
  .sch-name { font-size: min(5.2vh, 2.8vw); font-weight: 600; color: var(--c); }
  .sch-count { font-size: min(3.4vh, 1.9vw); font-weight: 500; color: var(--fg); }
  .sch-count b { font-size: 1.7em; font-weight: 500; color: var(--c); font-variant-numeric: tabular-nums; margin: 0 .1em; }
  .tl { position: relative; height: min(1.5vh, 0.9vw); margin-top: .6vh; }
  .tl .seg { position: absolute; top: 0; height: 100%; border-radius: 99px; background: #262626; overflow: hidden; }
  .tl .seg i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); }
  .tl .seg.past i { width: 100%; opacity: .45; }
  .tl .now { position: absolute; top: -.7vh; bottom: -.7vh; width: 3px; margin-left: -1.5px; background: #fff; border-radius: 2px; }
  .tl-labels { position: relative; height: min(2.6vh, 1.5vw); font-size: min(2.2vh, 1.25vw); color: var(--dim); }
  .tl-labels span { position: absolute; transform: translateX(-50%); }
  .tl-labels span.cur { color: var(--fg); font-weight: 600; }
  .sch-next { font-size: min(2.4vh, 1.4vw); color: var(--dim); white-space: nowrap; }
  /* Austria show/hide toggle */
  .sub { position: relative; }
  .tg {
    font: inherit; color: var(--dim); background: none; border: 0; cursor: pointer;
    opacity: .3; transition: opacity .2s; padding: 0; line-height: 1;
  }
  .tg:hover, .tg:focus-visible { opacity: 1; outline: none; }
  .tg:focus-visible { box-shadow: 0 0 0 2px var(--dim); border-radius: 6px; }
  #sub-toggle {
    position: fixed; right: 1.2vw; bottom: 1.2vh;
    font-size: min(1.9vh, 1.1vw); letter-spacing: .18em; text-transform: uppercase; color: #6a6a6a;
    padding: .6em .9em;
  }
  .no-sub .sub { display: none; }
  .no-sub.no-school .info { justify-content: center; }
  .no-school .school { display: none; }
  .no-school .time { font-size: min(24vh, 13vw); }
  .date .u { font-size: .7em; margin: 0 .08em; }
  .date .wd { margin-left: .4em; }
  .main-info { display: flex; flex-direction: column; gap: 2vh; }

  .sub {
    display: flex; align-items: center; gap: 2.4vw;
    padding: 1.4vh 2vw; margin-right: 1vw;
    border: 1px solid var(--faint); border-radius: 2vh;
    align-self: flex-end;
  }
  #sub-clock { height: 14vh; width: 14vh; flex: none; }
  .sub-text { display: flex; flex-direction: column; gap: 1vh; }
  .sub .label { font-size: min(2vh, 1.2vw); }
  .sub .time { font-size: min(7.6vh, 4.2vw); font-weight: 300; }
  .sub .date { font-size: min(3vh, 1.8vw); font-weight: 500; color: var(--fg); }

  /* portrait / narrow screens: stack */
  @media (max-aspect-ratio: 1/1), (max-width: 700px) {
    .stage { grid-template-columns: 1fr; justify-items: center; align-content: center; gap: 2vh; padding: 3vh 5vw; }
    #main-clock { height: auto; width: min(80vw, 44vh); }
    .info { height: auto; padding: 0; justify-content: center; align-items: center; text-align: center; gap: 2vh; }
    .date { font-size: min(5vw, 3.4vh); }
    .time { font-size: min(14vw, 8vh); }
    .label { font-size: 12px; }
    .sub-head { justify-content: center; }
    .main-info .tod { font-size: min(4vw, 2.6vh); }
    .sub .tod { font-size: 14px; }
    .sub { align-self: center; margin-top: 1vh; margin-right: 0; gap: 16px; padding: 10px 18px; text-align: left; }
    #sub-clock { height: 72px; width: 72px; }
    .sub .time { font-size: 30px; }
    .sub .date { font-size: 14px; }
    .sub .label { font-size: 11px; }
  }
</style>
</head>
<body>
  <div class="stage">
    <svg id="main-clock" viewBox="-100 -100 200 200" role="img" aria-label="アナログ時計（日本時間）"></svg>
    <section class="info">
      <div class="main-info">
        <div class="sub-head">
          <div class="label">Japan · JST</div>
          <div class="tod" id="main-tod"></div>
        </div>
        <div class="date" id="main-date">--</div>
        <div class="time" id="main-time">--:--</div>
      </div>
      <section class="school" id="school" aria-live="off"></section>
      <aside class="sub" id="sub">
        <svg id="sub-clock" viewBox="-100 -100 200 200" role="img" aria-label="アナログ時計（オーストリア時間）"></svg>
        <div class="sub-text">
          <div class="sub-head">
            <div class="label">Austria · Vienna</div>
            <div class="tod" id="sub-tod"></div>
          </div>
          <div class="date" id="sub-date">--</div>
          <div class="time" id="sub-time">--:--</div>
        </div>
      </aside>
    </section>
  </div>
  <button class="tg" id="sub-toggle" type="button" title="オーストリア時間の表示切替 (A)"></button>

<script>
(() => {
  const SVGNS = "http://www.w3.org/2000/svg";
  const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

  const make = (name, attrs = {}) => {
    const el = document.createElementNS(SVGNS, name);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  };

  // Build an analog clock face inside the given <svg>; returns hand elements.
  function buildFace(svg, { detailed }) {
    svg.appendChild(make("circle", { r: 96, fill: "none", stroke: detailed ? "#444" : "#333", "stroke-width": detailed ? 1.5 : 3 }));

    for (let i = 0; i < 60; i++) {
      const major = i % 5 === 0;
      if (!detailed && !major) continue;
      const len = major ? (detailed ? 7 : 14) : 4;
      const a = (i * 6 * Math.PI) / 180;
      const r1 = 90, r2 = r1 - len;
      svg.appendChild(make("line", {
        x1: Math.sin(a) * r1, y1: -Math.cos(a) * r1,
        x2: Math.sin(a) * r2, y2: -Math.cos(a) * r2,
        stroke: major ? "#f2f2f2" : "#666",
        "stroke-width": major ? (detailed ? 2.5 : 5) : 1,
        "stroke-linecap": "round",
      }));
    }

    if (detailed) {
      for (let h = 1; h <= 12; h++) {
        const a = (h * 30 * Math.PI) / 180;
        const t = make("text", {
          x: Math.sin(a) * 67, y: -Math.cos(a) * 67,
          fill: "#f2f2f2", "font-size": 18, "font-weight": 600,
          "text-anchor": "middle", "dominant-baseline": "central",
          "font-family": "Murecho, Hiragino Sans, Noto Sans JP, sans-serif",
        });
        t.textContent = h;
        svg.appendChild(t);
      }
    }

    const hand = (w, len, color, tail = 0) => {
      const g = make("line", { x1: 0, y1: tail, x2: 0, y2: -len, stroke: color, "stroke-width": w, "stroke-linecap": "round" });
      svg.appendChild(g);
      return g;
    };
    const hour = hand(detailed ? 5 : 6, detailed ? 38 : 48, "#f2f2f2");
    const minute = hand(detailed ? 3.5 : 4, detailed ? 54 : 70, "#f2f2f2");
    const second = detailed ? hand(1.5, 74, "#ff5a4d", 16) : null;
    svg.appendChild(make("circle", { r: detailed ? 4 : 5, fill: detailed ? "#ff5a4d" : "#f2f2f2" }));
    return { hour, minute, second };
  }

  const main = buildFace(document.getElementById("main-clock"), { detailed: true });
  const sub = buildFace(document.getElementById("sub-clock"), { detailed: false });

  const fmt = (tz) => new Intl.DateTimeFormat("en-GB", {
    timeZone: tz, hourCycle: "h23",
    year: "numeric", month: "numeric", day: "numeric", weekday: "short",
    hour: "numeric", minute: "numeric", second: "numeric",
  });
  const jst = fmt("Asia/Tokyo");
  const vie = fmt("Europe/Vienna");

  const WD_INDEX = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  const pad = (n) => String(n).padStart(2, "0");

  function parts(formatter, date) {
    const o = {};
    for (const p of formatter.formatToParts(date)) o[p.type] = p.value;
    return {
      y: +o.year, mo: +o.month, d: +o.day, wd: WD_INDEX[o.weekday],
      h: +o.hour, mi: +o.minute, s: +o.second,
    };
  }

  const rot = (el, deg) => el && el.setAttribute("transform", `rotate(${deg})`);

  function setHands(hands, t, ms) {
    const sec = t.s + ms / 1000;
    const min = t.mi + sec / 60;
    const hr = (t.h % 12) + min / 60;
    rot(hands.hour, hr * 30);
    rot(hands.minute, min * 6);
    rot(hands.second, sec * 6);
  }

  const el = (id) => document.getElementById(id);
  const dateText = (t) =>
    `${t.y}<span class="u">年</span>${t.mo}<span class="u">月</span>${t.d}<span class="u">日</span><span class="wd">${WEEKDAYS[t.wd]}</span>`;
  const timeText = (t) => `${pad(t.h)}:${pad(t.mi)}`;

  // Time-of-day: early morning 4-6, morning 6-11, day 11-16, evening 16-19, night 19-4
  const ICONS = {
    dawn: '<path d="M6 34h36M14 34a10 10 0 0 1 20 0M24 10v8M24 10l-4 4M24 10l4 4M9 24l4 3M39 24l-4 3"/>',
    morning: '<circle cx="24" cy="26" r="8"/><path d="M24 8v5M24 39v1M8 26h5M35 26h5M12.5 14.5l3.5 3.5M31.5 34l3.5 3.5M35.5 14.5L32 18M12.5 37.5L16 34"/><path d="M6 42h36"/>',
    day: '<circle cx="24" cy="24" r="9"/><path d="M24 4v6M24 38v6M4 24h6M38 24h6M9.9 9.9l4.2 4.2M33.9 33.9l4.2 4.2M38.1 9.9l-4.2 4.2M14.1 33.9l-4.2 4.2"/>',
    evening: '<path d="M6 34h36M14 34a10 10 0 0 1 20 0M24 12v8M24 20l-4-4M24 20l4-4M9 24l4 3M39 24l-4 3M12 41h24"/>',
    night: '<path d="M32 8a16 16 0 1 0 8 26A14 14 0 0 1 32 8z"/><path d="M38 8v6M35 11h6"/>',
  };
  const TOD = {
    dawn:    { name: "早朝", color: "#ffb88a" },
    morning: { name: "朝",   color: "#ffd86b" },
    day:     { name: "昼",   color: "#ffe14d" },
    evening: { name: "夕",   color: "#ff8a5c" },
    night:   { name: "夜",   color: "#9ec2ff" },
  };
  const periodOf = (h) => h >= 4 && h < 6 ? "dawn" : h >= 6 && h < 11 ? "morning" : h >= 11 && h < 16 ? "day" : h >= 16 && h < 19 ? "evening" : "night";
  const todHTML = (h) => {
    const k = periodOf(h);
    return `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg><span>${TOD[k].name}</span>`;
  };
  const setTod = (id, h) => {
    const k = periodOf(h);
    if (cache[id] === k) return;
    cache[id] = k;
    const e = el(id);
    e.innerHTML = todHTML(h);
    e.style.setProperty("--tod", TOD[k].color);
  };

  // --- Class schedule (JST). Times in minutes from 00:00. ---
  const hm = (h, m) => h * 60 + m;
  const PERIODS = [
    { label: "1", name: "1校時",  s: hm(8, 45),  e: hm(10, 15), c: "#4fd1c5" },
    { label: "礼", name: "礼拝",  s: hm(10, 15), e: hm(10, 45), c: "#c9a8ff" },
    { label: "2", name: "2校時",  s: hm(10, 45), e: hm(12, 15), c: "#4fd1c5" },
    { label: "昼", name: "昼休み", s: hm(12, 15), e: hm(13, 15), c: "#8fd36b", rest: true },
    { label: "3", name: "3校時",  s: hm(13, 15), e: hm(14, 45), c: "#4fd1c5" },
    { label: "4", name: "4校時",  s: hm(15, 0),  e: hm(16, 30), c: "#4fd1c5" },
    { label: "5", name: "5校時",  s: hm(16, 45), e: hm(18, 15), c: "#4fd1c5" },
  ];
  const DAY_START = PERIODS[0].s, DAY_END = PERIODS[PERIODS.length - 1].e;
  const pct = (m) => ((m - DAY_START) / (DAY_END - DAY_START)) * 100;
  const hmText = (m) => `${Math.floor(m / 60)}:${pad(m % 60)}`;
  const durText = (m) => m >= 60 ? `<b>${Math.floor(m / 60)}</b>時間${m % 60 ? `<b>${m % 60}</b>分` : ""}` : `<b>${m}</b>分`;

  function schoolHTML(nowMin) {
    const cur = PERIODS.findIndex((p) => nowMin >= p.s && nowMin < p.e);
    const next = PERIODS.find((p) => p.s > nowMin);
    let name, color = "#9a9a9a", count = "", nextText = "";
    if (cur >= 0) {
      const p = PERIODS[cur];
      name = p.name; color = p.c;
      count = `終了まで あと${durText(p.e - nowMin)}`;
      if (PERIODS[cur + 1]) {
        const n = PERIODS[cur + 1];
        nextText = n.s === p.e ? `次は ${n.name}（${hmText(n.s)}〜）` : `次は ${n.name}（${hmText(n.s)}〜）／ ${hmText(p.e)} から休み時間`;
      } else {
        nextText = "本日最後のコマです";
      }
    } else if (next) {
      name = nowMin < DAY_START ? "授業前" : "休み時間";
      count = `${next.name}開始まで あと${durText(next.s - nowMin)}`;
      nextText = `${next.name} ${hmText(next.s)}〜${hmText(next.e)}`;
    } else {
      name = "本日の授業は終了";
      nextText = "お疲れさまでした";
    }

    const segs = PERIODS.map((p, i) => {
      const state = i === cur ? "cur" : p.e <= nowMin ? "past" : "future";
      const fill = i === cur ? `<i style="width:${((nowMin - p.s) / (p.e - p.s)) * 100}%"></i>` : "<i></i>";
      return `<div class="seg ${state}" style="--c:${p.c};left:${pct(p.s)}%;width:${pct(p.e) - pct(p.s) - 0.4}%">${fill}</div>`;
    }).join("");
    const labels = PERIODS.map((p, i) =>
      `<span class="${i === cur ? "cur" : ""}" style="left:${(pct(p.s) + pct(p.e)) / 2}%">${p.label}</span>`).join("");
    const inRange = nowMin >= DAY_START && nowMin <= DAY_END;
    const marker = inRange ? `<div class="now" style="left:${pct(nowMin)}%"></div>` : "";

    return `<div class="sch-row" style="--c:${color}"><div class="sch-name">${name}</div><div class="sch-count">${count}</div></div>`
      + `<div><div class="tl">${segs}${marker}</div><div class="tl-labels">${labels}</div></div>`
      + `<div class="sch-next">${nextText}</div>`;
  }

  // --- Japanese public holidays (computed; valid for 1980-2099) ---
  const holidayCache = {};
  function holidaysOf(year) {
    if (holidayCache[year]) return holidayCache[year];
    const set = new Set();
    const key = (m, d) => m * 100 + d;
    const dow = (m, d) => new Date(Date.UTC(year, m - 1, d)).getUTCDay();
    const nthMon = (m, n) => { const first = (1 - dow(m, 1) + 7) % 7 + 1; return first + 7 * (n - 1); };
    const k = year - 1980;
    const spring = Math.floor(20.8431 + 0.242194 * k - Math.floor(k / 4));
    const autumn = Math.floor(23.2488 + 0.242194 * k - Math.floor(k / 4));
    [[1, 1], [1, nthMon(1, 2)], [2, 11], [2, 23], [3, spring], [4, 29], [5, 3], [5, 4], [5, 5],
     [7, nthMon(7, 3)], [8, 11], [9, nthMon(9, 3)], [9, autumn], [10, nthMon(10, 2)], [11, 3], [11, 23]]
      .forEach(([m, d]) => set.add(key(m, d)));
    // Substitute holiday: a holiday on Sunday moves to the next non-holiday day.
    const base = [...set];
    base.forEach((v) => {
      const m = Math.floor(v / 100), d = v % 100;
      if (dow(m, d) !== 0) return;
      let t = new Date(Date.UTC(year, m - 1, d + 1));
      while (set.has(key(t.getUTCMonth() + 1, t.getUTCDate()))) t = new Date(t.getTime() + 864e5);
      set.add(key(t.getUTCMonth() + 1, t.getUTCDate()));
    });
    // Citizens' holiday: a weekday sandwiched between two holidays.
    for (let m = 1; m <= 12; m++) for (let d = 1; d <= 31; d++) {
      const t = new Date(Date.UTC(year, m - 1, d));
      if (t.getUTCMonth() !== m - 1 || t.getUTCDay() === 0 || set.has(key(m, d))) continue;
      const pv = new Date(t.getTime() - 864e5), nx = new Date(t.getTime() + 864e5);
      if (set.has(key(pv.getUTCMonth() + 1, pv.getUTCDate())) && set.has(key(nx.getUTCMonth() + 1, nx.getUTCDate()))) set.add(key(m, d));
    }
    return (holidayCache[year] = set);
  }
  const isSchoolDay = (t) => t.wd !== 0 && t.wd !== 6 && !holidaysOf(t.y).has(t.mo * 100 + t.d);

  // --- Austria show/hide (button, "A" key, or ?austria=off|on; remembered in this browser) ---
  const SUB_KEY = "saselab-clock.austria";
  const store = {
    get() { try { return localStorage.getItem(SUB_KEY); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(SUB_KEY, v); } catch (e) {} },
  };
  const qs = new URLSearchParams(location.search).get("austria");
  if (qs === "off" || qs === "0") store.set("off");
  if (qs === "on" || qs === "1") store.set("on");
  const subBtn = document.getElementById("sub-toggle");
  const applySub = (visible) => {
    document.body.classList.toggle("no-sub", !visible);
    subBtn.textContent = visible ? "Austria −" : "Austria +";
    subBtn.setAttribute("aria-label", visible ? "オーストリア時間を隠す" : "オーストリア時間を表示");
  };
  let subVisible = store.get() !== "off";
  applySub(subVisible);
  const toggleSub = () => { subVisible = !subVisible; store.set(subVisible ? "on" : "off"); applySub(subVisible); };
  subBtn.addEventListener("click", toggleSub);
  addEventListener("keydown", (e) => {
    if ((e.key === "a" || e.key === "A") && !e.ctrlKey && !e.metaKey && !e.altKey) toggleSub();
  });

  const cache = {};
  const setText = (id, v) => { if (cache[id] !== v) { cache[id] = v; el(id).innerHTML = v; } };

  function tick() {
    const now = new Date();
    const ms = now.getMilliseconds();
    const j = parts(jst, now);
    const v = parts(vie, now);

    setHands(main, j, ms);
    setHands(sub, v, 0);

    setText("main-date", dateText(j));
    setText("main-time", timeText(j));
    setText("sub-date", dateText(v));
    setText("sub-time", timeText(v));
    const school = isSchoolDay(j);
    document.body.classList.toggle("no-school", !school);
    setText("school", school ? schoolHTML(j.h * 60 + j.mi) : "");
    setTod("main-tod", j.h);
    setTod("sub-tod", v.h);

    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
